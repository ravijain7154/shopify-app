services:
  - type: web
    name: shopify-app
    env: node
    region: oregon
    branch: main
    buildCommand: npm install --legacy-peer-deps && npm run setup && npm run build
    preDeployCommand: ""
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production

