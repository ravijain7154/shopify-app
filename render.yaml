services:
  - type: web
    name: shopify-app
    env: node
    region: oregon
    branch: main
    # Clean any previous install, run deterministic install, and build via node
    # This avoids ENOTEMPTY / rename and Permission denied errors caused by
    # stale node_modules or missing exec bits in CI extract.
    buildCommand: rm -rf node_modules package-lock.json || true && npm cache clean --force || true && npm ci --legacy-peer-deps --prefer-offline && chmod -R +x node_modules/.bin || true && node ./node_modules/@remix-run/dev/dist/cli.js build
    # Run migrations separately during pre-deploy so DB migrations don't interfere
    # with the build step. We run Prisma via its node entrypoint to avoid wrapper issues.
    preDeployCommand: node ./node_modules/prisma/build/index.js generate && node ./node_modules/prisma/build/index.js migrate deploy
    startCommand: node ./node_modules/@remix-run/serve/dist/cli.js ./build/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production

