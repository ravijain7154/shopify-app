    <style>
     #diamond-app .grid-view #example_wrapper,
     #diamond-app .list-view .grid-view {
        display: none !important;
      }
     #diamond-app .grid-view {
        /* display: none; */
        gap: 10px;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        grid-auto-rows: minmax(100px, auto);
      }
   
      #diamond-app .grid-view .list-view {
        display: block;
      }

     #diamond-app #product-block {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }

     #diamond-app #product-block .product {
        border: 1px solid #ddd;
        padding: 10px;
        width: 200px;
        text-align: center;
      }

     #diamond-app #product-block .product img {
        max-width: 100%;
        height: auto;
      }
      /* Loader Styles */
      div#table-container {
    position: relative;
}
#diamond-app .loader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    display: none; /* Initially hidden */
}

#diamond-app .spinner {
    border: 4px solid #f3f3f3; /* Light grey */
    border-top: 4px solid #3498db; /* Blue color */
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
}

/* Keyframes for spinning animation */
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
